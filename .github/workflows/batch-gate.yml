name: batch-gate

on:
  pull_request:
  push:

jobs:
  batch-gate:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Batch post-commit gate
        env:
          FOOTBALL_ADVISOR_COMMIT_MESSAGE: ${{ toJSON(github.event.head_commit.message || github.event.pull_request.title || '') }}
        run: |
          $commitMessage = $env:FOOTBALL_ADVISOR_COMMIT_MESSAGE | ConvertFrom-Json
          python scripts\enforce_batch_gate.py --mode post-commit --commit-message "$commitMessage"

      - name: Unit tests
        run: |
          python -m unittest tests.test_batch_gate_artifacts tests.test_enforce_batch_gate -v
